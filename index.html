<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zxx Coder · Freelance</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ===== CSS VARIABLES ===== */
    :root {
      --bg-body: #f8fafc;
      --bg-card: #ffffff;
      --bg-nav: #ffffff;
      --bg-tool: #ffffff;
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #94a3b8;
      --border-color: #e2e8f0;
      --border-light: #f1f5f9;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.02);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.06);
      --badge-bg: #f1f5f9;
      --btn-bg: #0f172a;
      --btn-text: #ffffff;
      --icon-color: #0f172a;
      --quote-border: #0f172a;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-body: #0a0a0a;
      --bg-card: #141414;
      --bg-nav: #111111;
      --bg-tool: #141414;
      --text-primary: #eaeaea;
      --text-secondary: #a5a5a5;
      --text-muted: #7a7a7a;
      --border-color: #262626;
      --border-light: #1f1f1f;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.4);
      --shadow-hover: 0 8px 24px rgba(0,0,0,0.6);
      --badge-bg: #1f1f1f;
      --btn-bg: #eaeaea;
      --btn-text: #0a0a0a;
      --icon-color: #eaeaea;
      --quote-border: #4a4a4a;
      --input-bg: #1a1a1a;
    }

    /* ===== BASE ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--bg-body);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background 0.4s ease, color 0.4s ease;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 2rem;
      width: 100%;
    }

    /* ===== NAVIGATION ===== */
    nav {
      padding: 1.2rem 2rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      background: var(--bg-nav);
      margin: 0 -2rem;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: var(--text-primary);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--bg-body);
      transition: background 0.4s ease, color 0.4s ease;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.3rem;
      letter-spacing: -0.3px;
      color: var(--text-primary);
      transition: color 0.4s ease;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
      align-items: center;
    }

    .nav-links a {
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      transition: color 0.3s ease;
      position: relative;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--text-primary);
      transition: width 0.3s ease;
    }

    .nav-links a:hover {
      color: var(--text-primary);
    }

    .nav-links a:hover::after {
      width: 100%;
    }

    .nav-links a.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .nav-links a.active::after {
      width: 100%;
    }

    /* Theme toggle */
    .theme-toggle {
      background: var(--border-color);
      border: none;
      border-radius: 30px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      font-size: 1rem;
      color: var(--text-primary);
      transition: background 0.3s ease, transform 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .theme-toggle:hover {
      transform: scale(1.05) rotate(8deg);
    }

    /* ===== PAGE HEADER ===== */
    .page-header {
      margin: 2.5rem 0 2rem 0;
      animation: fadeSlideUp 0.6s ease;
    }

    .page-header h1 {
      font-size: 2.8rem;
      font-weight: 700;
      letter-spacing: -1px;
      color: var(--text-primary);
      display: inline-block;
      transition: color 0.4s ease;
    }

    .page-header .subhead {
      color: var(--text-secondary);
      font-size: 1.05rem;
      margin-top: 0.3rem;
      border-left: 3px solid var(--border-color);
      padding-left: 1rem;
      transition: color 0.4s ease, border-color 0.4s ease;
    }

    /* ===== HERO ===== */
    .hero-banner {
      background: var(--bg-card);
      border-radius: 20px;
      padding: 2.5rem 2.5rem;
      border: 1px solid var(--border-color);
      margin: 0.5rem 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2rem;
      box-shadow: var(--shadow-sm);
      transition: background 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease;
      animation: fadeSlideUp 0.5s ease;
    }

    .hero-banner .hero-text {
      flex: 1 1 300px;
    }

    .hero-banner .hero-text h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
      transition: color 0.4s ease;
    }

    .hero-banner .hero-text p {
      color: var(--text-secondary);
      font-size: 1rem;
      max-width: 500px;
      transition: color 0.4s ease;
    }

    .hero-banner .hero-stats {
      display: flex;
      gap: 2.5rem;
      flex-wrap: wrap;
    }

    .hero-banner .stat {
      text-align: center;
    }

    .hero-banner .stat .number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
      transition: color 0.4s ease;
    }

    .hero-banner .stat .label {
      color: var(--text-muted);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      transition: color 0.4s ease;
    }

    /* ===== BUTTONS ===== */
    .btn {
      display: inline-block;
      margin-top: 1rem;
      background: var(--btn-bg);
      border: none;
      padding: 0.7rem 2rem;
      border-radius: 60px;
      font-weight: 500;
      color: var(--btn-text);
      text-decoration: none;
      transition: background 0.3s ease, color 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .btn:hover::after {
      opacity: 1;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .btn-outline:hover {
      background: var(--badge-bg);
    }

    /* ===== SKILL TAGS ===== */
    .skill-tag {
      background: var(--badge-bg);
      border-radius: 40px;
      padding: 0.4rem 1rem;
      font-size: 0.8rem;
      font-weight: 500;
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      display: inline-block;
      margin: 0.2rem 0.2rem 0 0;
      transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease, transform 0.3s ease;
      animation: fadeSlideUp 0.5s ease;
    }

    .skill-tag:hover {
      transform: scale(1.05) rotate(-2deg);
    }

    .skill-tag i {
      margin-right: 5px;
      font-size: 0.75rem;
      color: var(--text-muted);
      transition: color 0.4s ease;
    }

    /* ===== CARDS ===== */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      margin: 2rem 0 2.5rem;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.8rem 1.5rem;
      transition: border 0.3s ease, transform 0.3s ease, box-shadow 0.3s ease, background 0.4s ease;
      box-shadow: var(--shadow-sm);
      animation: fadeSlideUp 0.6s ease;
    }

    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.2s; }

    .card:hover {
      border-color: var(--text-muted);
      transform: translateY(-5px) scale(1.01);
      box-shadow: var(--shadow-hover);
    }

    .card i {
      font-size: 2rem;
      color: var(--icon-color);
      margin-bottom: 0.8rem;
      display: inline-block;
      transition: color 0.4s ease, transform 0.3s ease;
    }

    .card:hover i {
      transform: scale(1.1) rotate(5deg);
    }

    .card h3 {
      font-weight: 600;
      font-size: 1.2rem;
      margin-bottom: 0.4rem;
      color: var(--text-primary);
      transition: color 0.4s ease;
    }

    .card p {
      color: var(--text-secondary);
      font-size: 0.9rem;
      transition: color 0.4s ease;
    }

    .badge {
      background: var(--badge-bg);
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      font-size: 0.7rem;
      font-weight: 500;
      color: var(--text-secondary);
      display: inline-block;
      margin-right: 0.3rem;
      margin-top: 0.6rem;
      border: 1px solid var(--border-color);
      transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
    }

    /* ===== TOOLS ===== */
    .tools-section {
      background: var(--bg-tool);
      border-radius: 16px;
      padding: 1.8rem 2rem;
      border: 1px solid var(--border-color);
      margin: 1.5rem 0;
      transition: background 0.4s ease, border-color 0.4s ease;
      animation: fadeSlideUp 0.5s ease;
    }

    .tools-section .tool-icons {
      display: flex;
      flex-wrap: wrap;
      gap: 1.5rem;
      margin-top: 0.8rem;
    }

    .tools-section .tool-icons i {
      font-size: 2.2rem;
      color: var(--text-muted);
      transition: color 0.3s ease, transform 0.3s ease;
      cursor: default;
    }

    .tools-section .tool-icons i:hover {
      color: var(--text-primary);
      transform: scale(1.2) rotate(10deg);
    }

    .tools-section h4 {
      color: var(--text-primary);
      font-weight: 600;
      transition: color 0.4s ease;
    }

    /* ===== TESTIMONIALS ===== */
    .testimonial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.5rem;
      margin: 1.5rem 0;
    }

    .testimonial {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.5rem;
      transition: background 0.4s ease, border-color 0.4s ease, transform 0.3s ease, box-shadow 0.3s ease;
      animation: fadeSlideUp 0.5s ease;
    }

    .testimonial:nth-child(2) { animation-delay: 0.1s; }
    .testimonial:nth-child(3) { animation-delay: 0.2s; }

    .testimonial:hover {
      transform: translateY(-3px) scale(1.01);
      box-shadow: var(--shadow-hover);
    }

    .testimonial .quote {
      color: var(--text-secondary);
      font-style: italic;
      font-size: 0.9rem;
      transition: color 0.4s ease;
    }

    .testimonial .author {
      margin-top: 0.8rem;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.85rem;
      transition: color 0.4s ease;
    }

    .testimonial .author span {
      color: var(--text-muted);
      font-weight: 400;
      transition: color 0.4s ease;
    }

    /* ===== ABOUT ===== */
    .about-highlight {
      display: flex;
      flex-wrap: wrap;
      gap: 2rem;
      background: var(--bg-card);
      border-radius: 20px;
      padding: 2rem 2rem;
      border: 1px solid var(--border-color);
      margin: 1.5rem 0;
      transition: background 0.4s ease, border-color 0.4s ease;
      animation: fadeSlideUp 0.5s ease;
    }

    .about-highlight .col {
      flex: 1 1 200px;
    }

    .about-highlight .col h4 {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 0.5rem;
      font-size: 0.95rem;
      letter-spacing: 0.2px;
      transition: color 0.4s ease;
    }

    .about-highlight .col p, .about-highlight .col li {
      color: var(--text-secondary);
      font-size: 0.9rem;
      transition: color 0.4s ease;
    }

    .about-highlight ul {
      list-style: none;
      padding: 0;
    }

    .about-highlight ul li {
      padding: 0.25rem 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .about-highlight ul li i {
      color: var(--text-muted);
      width: 18px;
      font-size: 0.85rem;
      transition: color 0.4s ease;
    }

    /* ===== CONTACT ===== */
    .contact-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 2rem 2rem;
      max-width: 600px;
      margin: 1.5rem 0 2.5rem;
      transition: background 0.4s ease, border-color 0.4s ease;
      animation: fadeSlideUp 0.5s ease;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border-light);
      transition: border-color 0.4s ease;
    }

    .contact-item:last-child {
      border-bottom: none;
    }

    .contact-item i {
      font-size: 1.3rem;
      width: 36px;
      color: var(--text-secondary);
      transition: color 0.4s ease;
    }

    .contact-item a, .contact-item span {
      color: var(--text-primary);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 450;
      transition: color 0.4s ease;
    }

    .contact-item a:hover {
      color: #2563eb;
      text-decoration: underline;
    }

    /* ===== 404 ===== */
    .error-404 {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 4rem 0;
      animation: fadeSlideUp 0.6s ease;
    }

    .error-404 .big {
      font-size: 7rem;
      font-weight: 700;
      line-height: 1;
      color: var(--border-color);
      letter-spacing: -4px;
      transition: color 0.4s ease;
    }

    .error-404 h2 {
      font-size: 1.6rem;
      margin: 0.8rem 0 0.3rem;
      color: var(--text-primary);
      transition: color 0.4s ease;
    }

    .error-404 p {
      color: var(--text-secondary);
      max-width: 400px;
      transition: color 0.4s ease;
    }

    /* ===== INFO BOX ===== */
    .info-box {
      background: var(--bg-card);
      border-radius: 16px;
      padding: 1.5rem;
      border: 1px solid var(--border-color);
      margin: 1rem 0 1.5rem;
      transition: background 0.4s ease, border-color 0.4s ease;
      animation: fadeSlideUp 0.5s ease;
    }

    .info-box p {
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 0.8rem;
      flex-wrap: wrap;
      transition: color 0.4s ease;
    }

    .info-box p i {
      color: var(--text-muted);
      transition: color 0.4s ease;
    }

    /* ===== QUOTE BOX ===== */
    .quote-box {
      background: var(--bg-body);
      border-radius: 16px;
      padding: 1.5rem;
      border-left: 4px solid var(--quote-border);
      margin: 1.5rem 0;
      transition: background 0.4s ease, border-color 0.4s ease;
    }

    .quote-box p {
      color: var(--text-secondary);
      font-style: italic;
      transition: color 0.4s ease;
    }

    /* ===== FOOTER ===== */
    footer {
      margin-top: auto;
      padding: 1.5rem 0;
      border-top: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      transition: border-color 0.4s ease, color 0.4s ease;
    }

    .footer-icons a {
      color: var(--text-muted);
      margin-left: 1rem;
      transition: color 0.3s ease, transform 0.3s ease;
    }

    .footer-icons a:hover {
      color: var(--text-primary);
      transform: scale(1.2) rotate(-5deg);
    }

    /* ===== ANIMATIONS ===== */
    @keyframes fadeSlideUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }

    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }

    .pulse-anim {
      animation: pulse 2s ease-in-out infinite;
    }

    .float-anim {
      animation: float 3s ease-in-out infinite;
    }

    .shimmer-text {
      background: linear-gradient(90deg, var(--text-primary) 25%, var(--text-muted) 50%, var(--text-primary) 75%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }

    .rotate-on-hover {
      transition: transform 0.5s ease;
    }
    .rotate-on-hover:hover {
      transform: rotate(360deg);
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 640px) {
      nav {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem 1.5rem;
        margin: 0 -2rem;
      }
      .nav-links {
        flex-wrap: wrap;
        gap: 1.2rem;
        margin-top: 0.3rem;
      }
      .page-header h1 {
        font-size: 2rem;
      }
      .about-highlight {
        flex-direction: column;
        padding: 1.5rem;
      }
      .hero-banner {
        flex-direction: column;
        text-align: center;
        padding: 1.8rem 1.5rem;
      }
      .hero-banner .hero-text p {
        margin: 0 auto;
      }
      .hero-banner .hero-stats {
        justify-content: center;
      }
      .theme-toggle span { display: none; }
    }
  </style>
</head>
<body>

<div class="container">

  <!-- ===== NAV ===== -->
  <nav>
    <div class="logo-area">
      <div class="logo-icon rotate-on-hover">⚡</div>
      <span class="logo-text">Zxx Coder</span>
    </div>
    <div style="display:flex; align-items:center; gap:1.5rem;">
      <div class="nav-links">
        <a href="index.html" class="active"><i class="fas fa-code"></i> Home</a>
        <a href="about.html"><i class="fas fa-user"></i> About</a>
        <a href="contact.html"><i class="fas fa-envelope"></i> Contact</a>
      </div>
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <i class="fas fa-sun" id="themeIcon"></i>
        <span id="themeLabel">Light</span>
      </button>
    </div>
  </nav>

  <!-- ===== PAGE CONTENT ===== -->
  <div id="page-content"></div>

  <footer>
    <span>© 2026 Zxx Coder · freelance</span>
    <div class="footer-icons">
      <a href="https://github.com/zxxcoder-hack/" target="_blank"><i class="fab fa-github"></i></a>
    </div>
  </footer>

</div>

<script>
  (function() {
    // ===== THEME =====
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
      return null;
    }

    function setCookie(name, value, days = 365) {
      const d = new Date();
      d.setTime(d.getTime() + (days * 24 * 60 * 60 * 1000));
      document.cookie = `${name}=${value}; expires=${d.toUTCString()}; path=/`;
    }

    function setTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const icon = document.getElementById('themeIcon');
      const label = document.getElementById('themeLabel');
      if (theme === 'dark') {
        icon.className = 'fas fa-moon';
        label.textContent = 'Dark';
      } else {
        icon.className = 'fas fa-sun';
        label.textContent = 'Light';
      }
      setCookie('theme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme') || 'light';
      setTheme(current === 'light' ? 'dark' : 'light');
    }

    // Load saved theme
    const savedTheme = getCookie('theme') || 'light';
    setTheme(savedTheme);

    document.getElementById('themeToggle').addEventListener('click', toggleTheme);

    // ===== PAGES =====
    const pages = {

      index: {
        title: 'Zxx Coder · Freelance',
        render: () => `
          <div class="page-header">
            <h1 class="shimmer-text">Build & deploy.</h1>

            <h2>Page not found</h2>
            <p>The page you're looking for doesn't exist or has been moved.</p>

    // ===== ROUTER =====
    function navigate(path) {
      let pageKey = path.replace(/^\/+/, '').replace(/\.html$/, '') || 'index';
      if (!pages[pageKey]) pageKey = '404';

      const page = pages[pageKey];
      document.title = page.title;

      document.querySelectorAll('.nav-links a').forEach(link => {
        link.classList.remove('active');
        const href = link.getAttribute('href') || '';
        if (href.includes(pageKey) || (pageKey === 'index' && href.includes('index.html'))) {
          link.classList.add('active');
        }
      });

      document.getElementById('page-content').innerHTML = page.render();
    }

    document.addEventListener('click', (e) => {
      const link = e.target.closest('.nav-links a');
      if (!link) return;
      const href = link.getAttribute('href');
      if (href && href.endsWith('.html')) {
        e.preventDefault();
        navigate(href);
        window.history.pushState(null, '', href);
      }
    });

    window.addEventListener('popstate', () => {
      const path = window.location.pathname.split('/').pop() || 'index.html';
      navigate(path);
    });

    const initialPath = window.location.pathname.split('/').pop() || 'index.html';
    navigate(initialPath);
  })();
</script>
